<!DOCTYPE html>
<html>
<head>
  <title>Hug From Me to You ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Comic Sans MS", Arial;
      background: linear-gradient(#ffe3ec, #ffd0df);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    h1 {
      color: #ff4d88;
      font-size: 36px;
      margin-bottom: 5px;
      text-shadow: 1px 1px 2px #ff99bb;
    }

    #message {
      margin-top: 10px;
      font-size: 22px;
      color: #e63a76;
      font-weight: bold;
      text-align: center;
      min-height: 40px;
    }

    /* Hug emoji animation */
    #hug {
      font-size: 80px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    button {
      margin-top: 20px;
      background: #ff5c8a;
      border: none;
      padding: 12px 25px;
      font-size: 20px;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(255, 80, 130, 0.4);
      transition: 0.25s;
    }

    button:hover {
      transform: scale(1.1);
      background: #ff3370;
    }

    .heart {
      position: absolute;
      font-size: 28px;
      color: #ff3d7f;
      animation: fly 2s linear forwards;
      pointer-events: none;
    }

    @keyframes fly {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-250px) scale(1.7);
      }
    }

  </style>
</head>
<body>

  <h1>Peluk Banyak Banyak Buat Arthaa💖</h1>

  <div id="hug">🤗</div>

  <div id="message"></div>

  <button onclick="sendLove()">Klik buat Pelukk ❤️</button>

  <script>
    const messages = [
      "peluk banyak banyak dari jauh 🤗💗",
      "Semoga mood kamu jadi lebih baik yaa cantikk 💕",
      "Aku bakal selalu ada buat kamu, im sure 🥺❤️",
      "cemangaaattt yaa 🤍",
      "Kamu itu penting banget buat aku 💓",
      "Ini pelukan spesial cuma buat Athaa 💝",
      "Kamu yang terbaik, jangan lupa itu! 💖"
    ];

    function sendLove() {
      // tampilkan pesan manis random
      const random = Math.floor(Math.random() * messages.length);
      document.getElementById("message").innerText = messages[random];

      // buat animasi hati banyak
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          createHeart();
        }, i * 80);
      }
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "💖";

      const x = window.innerWidth / 2 + (Math.random() * 220 - 110);
      const y = window.innerHeight / 2 + 40;

      heart.style.left = x + "px";
      heart.style.top = y + "px";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 2000);
    }
  </script>

</body>
</html>
